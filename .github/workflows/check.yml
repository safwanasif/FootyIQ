name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
  model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ml/requirements.txt
      - run: python -m pip install -r services/ml/requirements.txt
      - run: python -m unittest discover -s services/ml -p "test_*.py"
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_DATABASE_URL: postgresql://footyiq_test:footyiq_test@localhost:5432/footyiq_e2e
      NEXT_PUBLIC_API_URL: http://localhost:3002
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: footyiq_test
          POSTGRES_PASSWORD: footyiq_test
          POSTGRES_DB: footyiq_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U footyiq_test -d footyiq_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ml/requirements.txt
      - run: npm ci
      - run: python -m pip install -r services/ml/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  deployment-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: footyiq_test
          POSTGRES_PASSWORD: footyiq_test
          POSTGRES_DB: footyiq_deploy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U footyiq_test -d footyiq_deploy"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t footyiq-deploy .
      - name: Verify combined backend under the free memory limit
        shell: bash
        run: |
          docker run -d --name footyiq-deploy --network host --memory=512m --cpus=0.1 -e PORT=10000 -e COOKIE_SECURE=false -e WEB_ORIGIN=http://localhost:3000 -e DATABASE_URL=postgresql://footyiq_test:footyiq_test@localhost:5432/footyiq_deploy footyiq-deploy
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:10000/health; then break; fi
            sleep 3
          done
          curl --fail --silent http://localhost:10000/health
          curl --fail --silent --max-time 15 -H 'Content-Type: application/json' -d '{"distance_meters":11,"angle_degrees":37}' http://localhost:10000/api/v1/predict-proxy
          docker stats --no-stream footyiq-deploy
      - name: Container diagnostics
        if: always()
        run: docker logs footyiq-deploy
