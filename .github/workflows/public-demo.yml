name: Public demo check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-public-demo.py
